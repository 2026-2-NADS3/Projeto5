# =============================================================================
#  nginx.conf - Servidor do painel administrativo + proxy reverso para a API
# -----------------------------------------------------------------------------
#  Este arquivo contem o ponto mais importante da integracao entre containers:
#  o "proxy_pass http://api:3000" abaixo. O nome "api" NAO e' um endereco IP
#  nem "localhost" - e' o NOME DO SERVICO declarado no docker-compose.yml.
#  O servidor DNS interno da rede Docker (rede_proximaetapa) resolve esse nome
#  para o IP do container da API automaticamente.
#
#  Efeito pratico: o navegador do usuario fala apenas com o Nginx (porta 8080),
#  e o container do banco nunca fica exposto para fora da rede Docker.
# =============================================================================

upstream backend_api {
    # "api" = nome do servico no docker-compose.yml
    # "3000" = porta interna do container (nao a porta publicada no host)
    server api:3000;
}

server {
    listen       80;
    server_name  localhost;

    # Nao revelar a versao do Nginx nos cabecalhos de resposta.
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Cabecalhos basicos de seguranca
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        no-referrer-when-downgrade always;

    # Compressao das respostas de texto
    gzip              on;
    gzip_types        text/css application/javascript application/json text/plain;
    gzip_min_length   512;

    # -------------------------------------------------------------------------
    #  Arquivos estaticos do painel
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    #  PROXY REVERSO: /api/... -> container da API
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend_api;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Repassa tambem o endpoint de saude da API, util para depuracao.
    location = /api-health {
        proxy_pass http://backend_api/health;
    }

    # -------------------------------------------------------------------------
    #  Saude do proprio Nginx (usado pelo HEALTHCHECK do container)
    # -------------------------------------------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "nginx ok\n";
    }
}
