# Banco PostgreSQL de TESTE para os testes de integração.
# Se o docker-compose da entrega de Docker (Danilo) já tiver um serviço Postgres,
# use aquele e ajuste só a DATABASE_URL do .env.test.
services:
  db-test:
    image: postgres:16-alpine
    container_name: proxima-etapa-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proxima_etapa_test
    ports:
      - "5433:5432"
    volumes:
      - db-test-data:/var/lib/postgresql/data
    networks:
      - proxima-etapa

volumes:
  db-test-data:

networks:
  proxima-etapa:
